<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 6: Interactive Histogram with Filtering</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/visualisation.css">
    
    <!-- D3.js Library -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>TV Energy Consumption Analysis</h1>
            <h2>Energy Consumption for Different TV Screen Types and Sizes</h2>
        </header>
        
        <main>
            <!-- Charts Container -->
            <section id="charts-section">
                <div class="charts-grid">
                    <!-- Histogram Section with Filter Controls -->
                    <div class="chart-wrapper">
                        <!-- Filter Controls Section (grouped with histogram) -->
                        <div id="filter-section">
                            <div id="filter-controls" class="filter-controls"></div>
                        </div>
                        
                        <h2 class="chart-section-title">Energy Consumption Distribution</h2>
                        <div id="histogram" class="loading">
                            <span>Loading histogram...</span>
                        </div>
                    </div>
                    
                    <!-- Scatter Plot Section (Independent, no filter) -->
                    <div class="chart-wrapper">
                        <h2 class="chart-section-title">Energy Consumption by Star Rating</h2>
                        <div id="scatter" class="loading">
                            <span>Loading scatter plot...</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- JavaScript Files (Order is important!) -->
    <script src="js/shared-constants.js"></script>
    <script src="js/load-data.js"></script>
    <script src="js/histogram.js"></script>
    <script src="js/scatter.js"></script>
    <script src="js/interaction.js"></script>
    
    <!-- Main application logic -->
    <script>
        // Initialize application
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Application initializing...');
            
            // Load data and create visualization
            loadData()
                .then(() => {
                    console.log('Data loaded, initializing filters...');
                    initializeFilters();
                    console.log('Filters initialized, creating visualizations...');
                    createHistogram('All');
                    createScatterPlot('All');
                    console.log('Visualizations created successfully');
                })
                .catch(error => {
                    console.error('Failed to initialize application:', error);
                    document.getElementById('histogram').innerHTML = 
                        '<div class="error">Error loading data. Please check the console for details.</div>';
                });
        });
    </script>
</body>
</html>
